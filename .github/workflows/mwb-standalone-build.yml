name: MWB standalone build

on:
  workflow_dispatch:
  push:
    branches:
      - mwb-standalone
    tags:
      - 'mwb-v*'
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/interop/**'
      - 'src/settings-ui/Settings.UI.Library/**'
      - 'src/Common.Dotnet*.props'
      - 'src/Common.*.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/mwb-standalone-build.yml'
  pull_request:
    branches:
      - mwb-standalone
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/interop/**'
      - 'src/settings-ui/Settings.UI.Library/**'
      - 'src/Common.Dotnet*.props'
      - 'src/Common.*.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/mwb-standalone-build.yml'

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test MWB (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build legacy-shaped Mouse Without Borders project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\MouseWithoutBorders.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildTests=false

      - name: Build PowerToys-free standalone app project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\MouseWithoutBorders.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Build PowerToys-free standalone helper project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\Helper\MouseWithoutBordersHelper.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Build PowerToys-free standalone service project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\Service\MouseWithoutBordersService.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Verify the standalone projects outside the PowerToys tree
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'mwb-source.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'mwb-isolated'

          git archive --format=zip --prefix=MouseWithoutBorders/ --output=$archivePath HEAD:src/modules/MouseWithoutBorders
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          $mwbRoot = Join-Path $extractRoot 'MouseWithoutBorders'
          $forbiddenPaths = @(
            'App\MouseWithoutBorders.csproj',
            'App\Helper\MouseWithoutBordersHelper.csproj',
            'App\Service\MouseWithoutBordersService.csproj',
            'ModuleInterface',
            'Packaging'
          )

          foreach ($forbiddenPath in $forbiddenPaths) {
            if (Test-Path (Join-Path $mwbRoot $forbiddenPath)) {
              throw "PowerToys-only file leaked into the clean source archive: $forbiddenPath"
            }
          }

          & (Join-Path $mwbRoot 'build.ps1') -Configuration Release -Platform x64 -RunTests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish single-file portable app
        shell: pwsh
        run: |
          $mwbRoot = Join-Path $env:RUNNER_TEMP 'mwb-isolated\MouseWithoutBorders'
          $portableRoot = Join-Path $env:RUNNER_TEMP 'mwb-portable'
          $scripts = @('build.ps1', 'publish-portable.ps1', 'validate-icon.ps1')

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $scriptPath = Join-Path $mwbRoot $script
            [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $script."
            }
          }

          & (Join-Path $mwbRoot 'publish-portable.ps1') `
            -Configuration Release `
            -Platform x64 `
            -Destination $portableRoot `
            -NoRestore

      - name: Upload clean standalone source
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-clean-source-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload single-file portable x64 build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-portable/MouseWithoutBorders.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach build to GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/mwb-v') ||
      (github.ref == 'refs/heads/mwb-standalone' && contains(github.event.head_commit.message, '[release]'))
    needs: build-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          request=src/modules/MouseWithoutBorders/Standalone/release-request.json
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            title="Mouse Without Borders ${tag#mwb-v}"
            prerelease=true
            printf '%s\n' \
              'Unsigned test build of the standalone green Mouse Without Borders fork.' \
              '' \
              'Download `MouseWithoutBorders.exe` from Assets and use the same release on every computer.' \
              > "$notes_file"
          else
            tag=$(jq -er '.tag' "$request")
            title=$(jq -er '.title' "$request")
            prerelease=$(jq -r '.prerelease' "$request")
            {
              jq -er '.summary' "$request"
              printf '\n\nChanges\n\n'
              jq -er '.changes[] | "- " + .' "$request"
              printf '\nTesting requested\n\n'
              jq -er '.testing[] | "- " + .' "$request"
            } > "$notes_file"
          fi

          if [[ ! "$tag" =~ ^mwb-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid MWB release tag: $tag"
            exit 1
          fi

          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "prerelease must be true or false"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download tested portable build
        uses: actions/download-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: release

      - name: Validate release package and create checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f release/MouseWithoutBorders.exe
          file_count=$(find release -maxdepth 1 -type f | wc -l)
          if [ "$file_count" -ne 1 ]; then
            echo "Expected exactly one compiled file, found $file_count."
            exit 1
          fi
          (
            cd release
            sha256sum MouseWithoutBorders.exe > MouseWithoutBorders.exe.sha256
          )

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/MouseWithoutBorders.exe \
              release/MouseWithoutBorders.exe.sha256 \
              --clobber
          else
            release_args=(
              "$RELEASE_TAG"
              release/MouseWithoutBorders.exe
              release/MouseWithoutBorders.exe.sha256
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --notes-file "$RUNNER_TEMP/release-notes.md"
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
