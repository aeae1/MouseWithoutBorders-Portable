name: MWB standalone build

on:
  workflow_dispatch:
  push:
    branches:
      - mwb-standalone
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/interop/**'
      - 'src/settings-ui/Settings.UI.Library/**'
      - 'src/Common.Dotnet*.props'
      - 'src/Common.*.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/mwb-standalone-build.yml'
  pull_request:
    branches:
      - mwb-standalone
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/interop/**'
      - 'src/settings-ui/Settings.UI.Library/**'
      - 'src/Common.Dotnet*.props'
      - 'src/Common.*.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/mwb-standalone-build.yml'

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test MWB (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build legacy-shaped Mouse Without Borders project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\MouseWithoutBorders.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildTests=false

      - name: Build PowerToys-free standalone app project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\MouseWithoutBorders.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Build PowerToys-free standalone helper project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\Helper\MouseWithoutBordersHelper.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Build PowerToys-free standalone service project
        shell: pwsh
        run: >-
          msbuild
          .\src\modules\MouseWithoutBorders\App\Service\MouseWithoutBordersService.Standalone.csproj
          /restore
          /m
          /p:Configuration=Release
          /p:Platform=x64

      - name: Verify the standalone projects outside the PowerToys tree
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'mwb-source.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'mwb-isolated'

          git archive --format=zip --prefix=MouseWithoutBorders/ --output=$archivePath HEAD:src/modules/MouseWithoutBorders
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          $mwbRoot = Join-Path $extractRoot 'MouseWithoutBorders'
          $forbiddenPaths = @(
            'App\MouseWithoutBorders.csproj',
            'App\Helper\MouseWithoutBordersHelper.csproj',
            'App\Service\MouseWithoutBordersService.csproj',
            'ModuleInterface'
          )

          foreach ($forbiddenPath in $forbiddenPaths) {
            if (Test-Path (Join-Path $mwbRoot $forbiddenPath)) {
              throw "PowerToys-only file leaked into the clean source archive: $forbiddenPath"
            }
          }

          & (Join-Path $mwbRoot 'build.ps1') -Configuration Release -Platform x64 -RunTests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate and stage manual-start package
        shell: pwsh
        run: |
          $mwbRoot = Join-Path $env:GITHUB_WORKSPACE 'src\modules\MouseWithoutBorders'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'mwb-package'
          $scripts = @(
            'Packaging\Install.ps1',
            'Packaging\Uninstall.ps1',
            'Packaging\Stage-Package.ps1',
            'build.ps1'
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $scriptPath = Join-Path $mwbRoot $script
            [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $script."
            }
          }

          $installerText = Get-Content -LiteralPath (Join-Path $mwbRoot 'Packaging\Install.ps1') -Raw
          foreach ($automaticStartMarker in @('CurrentVersion\Run', 'Start Menu\Programs\Startup', 'StartupApproved')) {
            if ($installerText.Contains($automaticStartMarker)) {
              throw "Manual run mode violation: installer contains $automaticStartMarker."
            }
          }

          & (Join-Path $mwbRoot 'Packaging\Stage-Package.ps1') `
            -BuildRoot (Join-Path $mwbRoot 'artifacts\standalone\x64\Release') `
            -Destination $packageRoot

          & (Join-Path $packageRoot 'Install.ps1') `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'mwb-whatif-install') `
            -UserSid 'S-1-5-21-1000-1000-1000-1000' `
            -UserLocalAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-local') `
            -UserRoamingAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-roaming') `
            -WhatIf

          & (Join-Path $packageRoot 'Uninstall.ps1') `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'mwb-whatif-install') `
            -UserRoamingAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-roaming') `
            -WhatIf

      - name: Upload clean standalone source
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-clean-source-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone x64 test build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-standalone-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-package/**
          if-no-files-found: error
          retention-days: 14
