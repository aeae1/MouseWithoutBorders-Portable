name: MWB Standalone CI

on:
  push:
    branches:
      - mwb-standalone
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - '.github/workflows/mwb-standalone-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/Common.*.props'
      - 'src/Version.props'
  pull_request:
    paths:
      - 'src/modules/MouseWithoutBorders/**'
      - '.github/workflows/mwb-standalone-ci.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/Common.*.props'
      - 'src/Version.props'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore MWB tests and dependencies
        shell: pwsh
        run: |
          msbuild src/modules/MouseWithoutBorders/MouseWithoutBorders.UnitTests/MouseWithoutBorders.UnitTests.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64 /m

      - name: Build MWB app and unit tests
        shell: pwsh
        run: |
          msbuild src/modules/MouseWithoutBorders/MouseWithoutBorders.UnitTests/MouseWithoutBorders.UnitTests.csproj /p:Configuration=Debug /p:Platform=x64 /m

      - name: Run MWB unit tests
        shell: pwsh
        run: |
          dotnet test src/modules/MouseWithoutBorders/MouseWithoutBorders.UnitTests/MouseWithoutBorders.UnitTests.csproj --no-build -c Debug -p:Platform=x64
