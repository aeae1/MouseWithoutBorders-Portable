name: MWB portable build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'mwb-v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test MWB (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify clean repository layout
        shell: pwsh
        run: .\validate-repository.ps1

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64 -RunTests

      - name: Publish single-file portable app
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP 'mwb-portable'
          $scripts = @(
            'build.ps1',
            'publish-portable.ps1',
            'validate-icon.ps1',
            'validate-repository.ps1'
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $script."
            }
          }

          .\publish-portable.ps1 `
            -Configuration Release `
            -Platform x64 `
            -Destination $portableRoot `
            -NoRestore

      - name: Upload single-file portable x64 build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-portable/MouseWithoutBorders.exe
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Attach build to GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/mwb-v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          request=.github/release-request.json
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            title="Mouse Without Borders ${tag#mwb-v}"
            prerelease=true
            printf '%s\n' \
              'Unsigned prerelease build of the portable green Mouse Without Borders fork.' \
              '' \
              'Download `MouseWithoutBorders.exe` from Assets and use the same release on every computer.' \
              > "$notes_file"
          else
            tag=$(jq -er '.tag' "$request")
            title=$(jq -er '.title' "$request")
            prerelease=$(jq -r '.prerelease' "$request")
            {
              jq -er '.summary' "$request"
              printf '\n\nChanges\n\n'
              jq -er '.changes[] | "- " + .' "$request"
              printf '\nTesting requested\n\n'
              jq -er '.testing[] | "- " + .' "$request"
            } > "$notes_file"
          fi

          if [[ ! "$tag" =~ ^mwb-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid MWB release tag: $tag"
            exit 1
          fi

          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "prerelease must be true or false"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download tested portable build
        uses: actions/download-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: release

      - name: Validate release package and create checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f release/MouseWithoutBorders.exe
          file_count=$(find release -maxdepth 1 -type f | wc -l)
          if [ "$file_count" -ne 1 ]; then
            echo "Expected exactly one compiled file, found $file_count."
            exit 1
          fi
          (
            cd release
            sha256sum MouseWithoutBorders.exe > MouseWithoutBorders.exe.sha256
          )

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/MouseWithoutBorders.exe \
              release/MouseWithoutBorders.exe.sha256 \
              --clobber
          else
            release_args=(
              "$RELEASE_TAG"
              release/MouseWithoutBorders.exe
              release/MouseWithoutBorders.exe.sha256
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --notes-file "$RUNNER_TEMP/release-notes.md"
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

      - name: Keep only the two newest release candidates
        if: steps.release.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t old_release_ids < <(
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '[.[] | select(.prerelease == true and (.tag_name | test("^mwb-v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+$"))) | {id, published_at}] | sort_by(.published_at) | reverse | .[2:] | .[].id'
          )

          for release_id in "${old_release_ids[@]}"; do
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done
