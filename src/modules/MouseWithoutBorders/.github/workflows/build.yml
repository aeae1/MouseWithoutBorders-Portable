name: Build Mouse Without Borders

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64 -RunTests

      - name: Validate and stage manual-start package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'mwb-package'
          $scripts = @(
            'Packaging\Install.ps1',
            'Packaging\Uninstall.ps1',
            'Packaging\Check-Installation.ps1',
            'Packaging\Stage-Package.ps1',
            'build.ps1'
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $script."
            }
          }

          $installerText = Get-Content -LiteralPath .\Packaging\Install.ps1 -Raw
          foreach ($automaticStartMarker in @('CurrentVersion\Run', 'Start Menu\Programs\Startup', 'StartupApproved')) {
            if ($installerText.Contains($automaticStartMarker)) {
              throw "Manual run mode violation: installer contains $automaticStartMarker."
            }
          }

          .\Packaging\Stage-Package.ps1 `
            -BuildRoot .\artifacts\standalone\x64\Release `
            -Destination $packageRoot

          & (Join-Path $packageRoot 'Install.ps1') `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'mwb-whatif-install') `
            -UserSid 'S-1-5-21-1000-1000-1000-1000' `
            -UserLocalAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-local') `
            -UserRoamingAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-roaming') `
            -WhatIf

          & (Join-Path $packageRoot 'Uninstall.ps1') `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'mwb-whatif-install') `
            -UserRoamingAppData (Join-Path $env:RUNNER_TEMP 'mwb-user-roaming') `
            -WhatIf

          foreach ($requiredPackageFile in @('Check-Installation.cmd', 'Check-Installation.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $requiredPackageFile) -PathType Leaf)) {
              throw "Installation checker is missing from the package: $requiredPackageFile"
            }
          }

      - name: Upload x64 development build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-package/**
          if-no-files-found: error
          retention-days: 14
