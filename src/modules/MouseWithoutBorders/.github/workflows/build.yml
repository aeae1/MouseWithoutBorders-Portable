name: Build Mouse Without Borders

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64 -RunTests

      - name: Publish single-file portable app
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP 'mwb-portable'
          $scripts = @('build.ps1', 'publish-portable.ps1')

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $script."
            }
          }

          .\publish-portable.ps1 `
            -Configuration Release `
            -Platform x64 `
            -Destination $portableRoot `
            -NoRestore

      - name: Upload single-file portable x64 build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: ${{ runner.temp }}/mwb-portable/MouseWithoutBorders.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach build to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested portable build
        uses: actions/download-artifact@v4
        with:
          name: MouseWithoutBorders-portable-x64-${{ github.sha }}
          path: release

      - name: Validate release package and create checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f release/MouseWithoutBorders.exe
          file_count=$(find release -maxdepth 1 -type f | wc -l)
          if [ "$file_count" -ne 1 ]; then
            echo "Expected exactly one compiled file, found $file_count."
            exit 1
          fi
          (
            cd release
            sha256sum MouseWithoutBorders.exe > MouseWithoutBorders.exe.sha256
          )

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/MouseWithoutBorders.exe \
              release/MouseWithoutBorders.exe.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release/MouseWithoutBorders.exe \
              release/MouseWithoutBorders.exe.sha256 \
              --target "$GITHUB_SHA" \
              --title "Mouse Without Borders $RELEASE_TAG" \
              --notes "Unsigned test build of the standalone green Mouse Without Borders fork. Download MouseWithoutBorders.exe from Assets and use the same release on every computer." \
              --prerelease
          fi
