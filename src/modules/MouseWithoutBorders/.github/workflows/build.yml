name: Build Mouse Without Borders

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    name: Build and test (x64)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64 -RunTests

      - name: Upload x64 development build
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithoutBorders-x64-${{ github.sha }}
          path: artifacts/standalone/x64/Release/**
          if-no-files-found: error
          retention-days: 14
